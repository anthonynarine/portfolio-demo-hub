<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">What every change gets from Foundry</title>
  <desc id="d">Five guarantees. Continuity: tasks, handoffs and decisions live in the repository, so any agent picks up cold. Observation: every agent session is recorded by Foundry, not by the agent. Secret safety: agents never see application secrets. Independent review: Security and QA are separate agents. Signed release: exact code, tests, reviews and my signature before main changes. Agents keep their freedom; hard lines only where an action is irreversible.</desc>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1d1d21"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#0b0b0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c879" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f2c879" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0c"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="19" letter-spacing="6" fill="#8a8a8a">FOUNDRY  ·  THE GUARANTEES</text>
    <text x="72" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="62" fill="#fafafa">What every change gets.</text>

    <!-- tiles -->
    <g fill="#141416" stroke="#2a2a2e" stroke-width="2">
      <rect x="72" y="230" width="275" height="540" rx="18"/>
      <rect x="367" y="230" width="275" height="540" rx="18"/>
      <rect x="662" y="230" width="275" height="540" rx="18"/>
      <rect x="957" y="230" width="275" height="540" rx="18"/>
      <rect x="1252" y="230" width="276" height="540" rx="18" stroke="#f2c879"/>
    </g>

    <!-- icons -->
    <!-- continuity: linked commits -->
    <g fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round">
      <line x1="104" y1="320" x2="236" y2="320"/>
      <circle cx="116" cy="320" r="13" fill="#141416"/>
      <circle cx="170" cy="320" r="13" fill="#141416"/>
      <circle cx="224" cy="320" r="13" fill="#141416"/>
    </g>
    <!-- observation: eye -->
    <g fill="none" stroke="#c4b5fd" stroke-width="4" stroke-linejoin="round">
      <path d="M399 320 C 429 286, 489 286, 519 320 C 489 354, 429 354, 399 320 Z"/>
      <circle cx="459" cy="320" r="13" fill="#c4b5fd"/>
    </g>
    <!-- secret safety: lock -->
    <g fill="none" stroke="#fda4af" stroke-width="4" stroke-linejoin="round">
      <path d="M716 314 v-14 a22 22 0 0 1 44 0 v14"/>
      <rect x="704" y="314" width="68" height="46" rx="8"/>
      <circle cx="738" cy="335" r="5" fill="#fda4af" stroke="none"/>
    </g>
    <!-- independent review: two checks -->
    <g fill="#0e1a12" stroke="#86efac" stroke-width="3">
      <circle cx="1011" cy="320" r="24"/>
      <circle cx="1071" cy="320" r="24"/>
    </g>
    <g fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1001 320 l7 8 l13 -15"/>
      <path d="M1061 320 l7 8 l13 -15"/>
    </g>
    <!-- signed release: seal -->
    <circle cx="1320" cy="320" r="62" fill="url(#sealGlow)"/>
    <circle cx="1320" cy="320" r="34" fill="#1a160d" stroke="#f2c879" stroke-width="3"/>
    <path d="M1302 326 c4 -15 9 -15 8 -4 c-1 9 5 7 8 -3 c2 -7 6 -8 7 -1 c1 5 4 5 8 -4" fill="none" stroke="#f2c879" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- titles -->
    <g font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#fafafa">
      <text x="100" y="420">Continuity</text>
      <text x="395" y="420">Observation</text>
      <text x="690" y="420">Secret safety</text>
      <text x="985" y="404">Independent</text>
      <text x="985" y="442">review</text>
      <text x="1280" y="420" fill="#f2c879">Signed release</text>
    </g>

    <!-- descriptions -->
    <g font-size="22" fill="#d4d4d4">
      <text x="100" y="490">Tasks, handoffs and</text>
      <text x="100" y="522">decisions live in the</text>
      <text x="100" y="554">repository. Any agent,</text>
      <text x="100" y="586">tool or machine picks</text>
      <text x="100" y="618">up the work cold.</text>

      <text x="395" y="490">Every agent session</text>
      <text x="395" y="522">is recorded: prompts,</text>
      <text x="395" y="554">tool calls, files and</text>
      <text x="395" y="586">failures. Recorded by</text>
      <text x="395" y="618">Foundry, not the agent.</text>

      <text x="690" y="490">Agents never see</text>
      <text x="690" y="522">application secrets.</text>
      <text x="690" y="554">Paths are classified</text>
      <text x="690" y="586">before anything is</text>
      <text x="690" y="618">read or copied.</text>

      <text x="985" y="490">Security and QA are</text>
      <text x="985" y="522">separate agents.</text>
      <text x="985" y="554">No one grades their</text>
      <text x="985" y="586">own work.</text>

      <text x="1280" y="490">The exact code, its</text>
      <text x="1280" y="522">tests and reviews,</text>
      <text x="1280" y="554">then my signature,</text>
      <text x="1280" y="586">before main changes.</text>
    </g>

    <!-- tags -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#737373">
      <text x="100" y="738">handoff.submitted</text>
      <text x="395" y="738">observed session</text>
      <text x="690" y="738">secret policy</text>
      <text x="985" y="738">diff.reviewed</text>
      <text x="1280" y="738" fill="#b8975a">approval.granted</text>
    </g>

    <line x1="72" y1="834" x2="1528" y2="834" stroke="#2a2a2e" stroke-width="2"/>
    <text x="72" y="892" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#e5e5e5">Agents keep their freedom. Hard lines only where it can't be undone:</text>
    <text x="72" y="936" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="30" fill="#f2c879">secrets, merges to main, deploys.</text>
  </g>
</svg>
