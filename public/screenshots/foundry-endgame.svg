<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Foundry's end game</title>
  <desc id="d">The goal: the record, evidence and safety layer for software built with AI agents. Today it runs my own projects. Next, product core: install it anywhere, foundry init detects any stack, evidence-gated release in one command. Then distribution: a Claude Code plugin and a GitHub Action that blocks pull requests missing evidence, Codex support, and a live view of every agent session. Then proof: three apps shipped through it, including one built from an empty repository to production. The target: any team, any stack, any agent, set up in fifteen minutes.</desc>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1d1d21"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#0b0b0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="hereGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c879" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f2c879" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="road" gradientUnits="userSpaceOnUse" x1="92" y1="0" x2="1500" y2="0">
      <stop offset="0%" stop-color="#f2c879"/>
      <stop offset="22%" stop-color="#e5e5e5"/>
      <stop offset="100%" stop-color="#525252"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0c"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="92" font-size="19" letter-spacing="6" fill="#8a8a8a">FOUNDRY  ·  THE END GAME</text>
    <text x="72" y="164" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#fafafa">The record, evidence and safety layer</text>
    <text x="72" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#fafafa">for software built with <tspan font-style="italic" fill="#f2c879">AI agents.</tspan></text>

    <!-- road -->
    <line x1="92" y1="360" x2="1500" y2="360" stroke="url(#road)" stroke-width="6" stroke-linecap="round"/>
    <path d="M1500 360 l-16 -10 v20 z" fill="#525252"/>

    <!-- milestones -->
    <circle cx="110" cy="360" r="70" fill="url(#hereGlow)"/>
    <circle cx="110" cy="360" r="22" fill="#1a160d" stroke="#f2c879" stroke-width="4"/>
    <circle cx="110" cy="360" r="8" fill="#f2c879"/>
    <g fill="#0b0b0c" stroke-width="4">
      <circle cx="482" cy="360" r="18" stroke="#5eead4"/>
      <circle cx="854" cy="360" r="18" stroke="#c4b5fd"/>
      <circle cx="1226" cy="360" r="18" stroke="#fda4af"/>
    </g>

    <!-- labels -->
    <g font-size="16" letter-spacing="4" font-weight="700">
      <text x="72" y="430" fill="#f2c879">NOW</text>
      <text x="444" y="430" fill="#5eead4">NEXT</text>
      <text x="816" y="430" fill="#c4b5fd">THEN</text>
      <text x="1188" y="430" fill="#fda4af">PROOF</text>
    </g>
    <g font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#fafafa">
      <text x="72" y="476">My own projects</text>
      <text x="444" y="476">Product core</text>
      <text x="816" y="476">Distribution</text>
      <text x="1188" y="476">Three apps</text>
    </g>

    <!-- columns -->
    <g font-size="20" fill="#d4d4d4">
      <text x="72" y="536">Gait, Foundry and this site</text>
      <text x="72" y="568">ship through it</text>
      <text x="72" y="620">Signed, evidence-gated</text>
      <text x="72" y="652">releases</text>
      <text x="72" y="704">Language-agnostic</text>
      <text x="72" y="736">by design</text>

      <text x="444" y="536">Install it on any</text>
      <text x="444" y="568">repository</text>
      <text x="444" y="620"><tspan font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" fill="#5eead4">foundry init</tspan> detects</text>
      <text x="444" y="652">the stack</text>
      <text x="444" y="704">Evidence-gated release</text>
      <text x="444" y="736">in one command</text>

      <text x="816" y="536">Claude Code plugin and</text>
      <text x="816" y="568">a GitHub Action</text>
      <text x="816" y="620">Pull requests missing</text>
      <text x="816" y="652">evidence get blocked</text>
      <text x="816" y="704">A live view of every</text>
      <text x="816" y="736">agent session, any tool</text>

      <text x="1188" y="536">Gait and Lumen ship</text>
      <text x="1188" y="568">changes through it</text>
      <text x="1188" y="620">A new app built from an</text>
      <text x="1188" y="652">empty repo to production</text>
      <text x="1188" y="704">Case studies of what</text>
      <text x="1188" y="736">it caught</text>
    </g>

    <!-- target -->
    <rect x="72" y="808" width="1456" height="120" rx="18" fill="#141416" stroke="#f2c879" stroke-width="2"/>
    <text x="104" y="852" font-size="16" letter-spacing="4" font-weight="700" fill="#f2c879">THE TARGET</text>
    <text x="104" y="900" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#fafafa">Any team, any stack, any agent: <tspan font-style="italic" fill="#f2c879">set up in fifteen minutes.</tspan></text>
  </g>
</svg>
