<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-labelledby="t d">
  <title id="t">Foundry: agents build, evidence decides, I sign</title>
  <desc id="d">A git graph. I state an outcome; the Orchestrator branches three agent worktrees off main (backend, frontend, docs), each committing on its own branch; every branch passes an independent Security and QA review gate; the reviewed work merges back into main only at my signature, then releases. An audit log runs underneath.</desc>
  <style>
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .ping { animation: ping 2.4s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    .ping.late { animation-delay: 1.2s; }
    .flowing { animation: flowing 1.1s linear infinite; }
    .breathe { animation: breathe 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.75; } 50% { transform: scale(1.18); opacity: 1; } }
    @keyframes ping { 0% { transform: scale(1); opacity: 0.7; } 80%, 100% { transform: scale(1.7); opacity: 0; } }
    @keyframes flowing { to { stroke-dashoffset: -28; } }
    @keyframes breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .motion { display: none; }
      .pulse, .ping, .flowing, .breathe { animation: none; }
    }
  </style>
  <defs>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#1d1d21"/>
    </pattern>
    <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
      <stop offset="60%" stop-color="#0b0b0c" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f2c879" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#f2c879" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mergeLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fafafa"/>
      <stop offset="100%" stop-color="#f2c879"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#e5e5e5"/>
    </marker>
  </defs>

  <rect width="1600" height="1000" fill="#0b0b0c"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#vignette)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">

    <!-- heading -->
    <text x="72" y="92" font-size="19" letter-spacing="6" fill="#8a8a8a">FOUNDRY  ·  HOW A CHANGE SHIPS</text>
    <text x="72" y="166" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#fafafa">Agents build. Evidence decides. <tspan font-style="italic" fill="#f2c879">I sign.</tspan></text>

    <!-- the outcome -->
    <rect x="72" y="208" width="420" height="104" rx="14" fill="#141416" stroke="#2a2a2e" stroke-width="2"/>
    <text x="96" y="246" font-size="15" letter-spacing="3.5" font-weight="600" fill="#f2c879">ME  ·  THE OUTCOME</text>
    <text x="96" y="288" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="27" fill="#fafafa">“Add CSV export for tenants”</text>
    <path d="M190 312 C 190 520, 300 560, 300 718" fill="none" stroke="#f2c879" stroke-width="2.5" stroke-dasharray="6 8" opacity="0.8" class="flowing"/>

    <!-- main -->
    <line x1="72" y1="760" x2="1536" y2="760" stroke="#e5e5e5" stroke-width="6" stroke-linecap="round" marker-end="url(#head)"/>
    <text x="72" y="800" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#8a8a8a">main</text>
    <circle cx="140" cy="760" r="9" fill="#0b0b0c" stroke="#d4d4d4" stroke-width="4"/>
    <circle cx="214" cy="760" r="9" fill="#0b0b0c" stroke="#d4d4d4" stroke-width="4"/>
    <circle cx="1450" cy="760" r="11" fill="#fafafa" class="breathe"/>
    <text x="1536" y="730" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19" fill="#a3a3a3">release</text>

    <!-- agent branches -->
    <g fill="none" stroke-width="5" stroke-linecap="round">
      <path d="M300 760 C 372 760, 360 360, 440 360 L 1030 360" stroke="#5eead4"/>
      <path d="M300 760 C 372 760, 360 470, 440 470 L 1030 470" stroke="#c4b5fd"/>
      <path d="M300 760 C 372 760, 360 580, 440 580 L 1030 580" stroke="#fda4af"/>
    </g>

    <!-- lane labels -->
    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="19">
      <text x="452" y="340" fill="#5eead4">agent/backend/csv-export</text>
      <text x="452" y="450" fill="#c4b5fd">agent/frontend/csv-export</text>
      <text x="452" y="560" fill="#fda4af">agent/docs/csv-export</text>
    </g>
    <g font-size="17" font-weight="600" fill="#d4d4d4">
      <text x="452" y="394">Backend agent <tspan font-weight="400" fill="#737373">· own worktree</tspan></text>
      <text x="452" y="504">Frontend agent <tspan font-weight="400" fill="#737373">· own worktree</tspan></text>
      <text x="452" y="614">Docs agent <tspan font-weight="400" fill="#737373">· own worktree</tspan></text>
    </g>

    <!-- commits -->
    <g stroke-width="4" fill="#0b0b0c">
      <circle cx="760" cy="360" r="10" stroke="#5eead4"/>
      <circle cx="840" cy="360" r="10" stroke="#5eead4"/>
      <circle cx="920" cy="360" r="10" stroke="#5eead4"/>
      <circle cx="990" cy="360" r="10" stroke="#5eead4"/>
      <circle cx="790" cy="470" r="10" stroke="#c4b5fd"/>
      <circle cx="880" cy="470" r="10" stroke="#c4b5fd"/>
      <circle cx="975" cy="470" r="10" stroke="#c4b5fd"/>
      <circle cx="820" cy="580" r="10" stroke="#fda4af"/>
      <circle cx="950" cy="580" r="10" stroke="#fda4af"/>
    </g>

    <!-- commits travelling: branch, review, signature -->
    <g class="motion" opacity="0">
      <circle r="14" fill="#5eead4" opacity="0.25"/>
      <circle r="7" fill="#5eead4"/>
      <animateMotion dur="6s" begin="0s" repeatCount="indefinite" path="M300 760 C 372 760, 360 360, 440 360 L 1030 360 L 1090 470 L 1150 470 C 1262 470, 1250 760, 1330 760"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="6s" begin="0s" repeatCount="indefinite"/>
    </g>
    <g class="motion" opacity="0">
      <circle r="14" fill="#c4b5fd" opacity="0.25"/>
      <circle r="7" fill="#c4b5fd"/>
      <animateMotion dur="6s" begin="2s" repeatCount="indefinite" path="M300 760 C 372 760, 360 470, 440 470 L 1030 470 L 1090 470 L 1150 470 C 1262 470, 1250 760, 1330 760"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="6s" begin="2s" repeatCount="indefinite"/>
    </g>
    <g class="motion" opacity="0">
      <circle r="14" fill="#fda4af" opacity="0.25"/>
      <circle r="7" fill="#fda4af"/>
      <animateMotion dur="6s" begin="4s" repeatCount="indefinite" path="M300 760 C 372 760, 360 580, 440 580 L 1030 580 L 1090 470 L 1150 470 C 1262 470, 1250 760, 1330 760"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.9;1" dur="6s" begin="4s" repeatCount="indefinite"/>
    </g>

    <!-- orchestrator, at the fork -->
    <circle cx="300" cy="760" r="36" fill="#0b0b0c" stroke="#fafafa" stroke-width="5"/>
    <circle cx="300" cy="760" r="13" fill="#fafafa" class="pulse"/>
    <text x="300" y="830" text-anchor="middle" font-size="24" font-weight="700" fill="#fafafa">Orchestrator</text>
    <text x="300" y="858" text-anchor="middle" font-size="17" fill="#8a8a8a">plans · assigns · keeps the record</text>

    <!-- independent review gate -->
    <text x="1090" y="296" text-anchor="middle" font-size="15" letter-spacing="3.5" font-weight="600" fill="#8a8a8a">REVIEW</text>
    <rect x="1030" y="316" width="120" height="308" rx="16" fill="#111113" stroke="#3f3f46" stroke-width="2"/>
    <circle cx="1090" cy="396" r="28" fill="none" stroke="#86efac" stroke-width="2" class="ping"/>
    <circle cx="1090" cy="536" r="28" fill="none" stroke="#86efac" stroke-width="2" class="ping late"/>
    <g stroke="#86efac" stroke-width="3">
      <circle cx="1090" cy="396" r="28" fill="#0e1a12"/>
      <circle cx="1090" cy="536" r="28" fill="#0e1a12"/>
    </g>
    <g fill="none" stroke="#86efac" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M1078 396 l8 9 l15 -18"/>
      <path d="M1078 536 l8 9 l15 -18"/>
    </g>
    <text x="1090" y="446" text-anchor="middle" font-size="16" font-weight="600" fill="#d4d4d4">Security</text>
    <text x="1090" y="586" text-anchor="middle" font-size="16" font-weight="600" fill="#d4d4d4">QA</text>
    <text x="1090" y="652" text-anchor="middle" font-size="15" fill="#737373">never the author</text>

    <!-- reviewed work merges at the signature -->
    <path d="M1150 470 C 1262 470, 1250 760, 1330 760" fill="none" stroke="url(#mergeLine)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="1330" cy="760" r="92" fill="url(#sealGlow)" class="pulse"/>
    <circle cx="1330" cy="760" r="50" fill="#1a160d" stroke="#f2c879" stroke-width="3"/>
    <circle cx="1330" cy="760" r="41" fill="none" stroke="#f2c879" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.7"/>
    <path d="M1302 768 c6 -22 14 -22 12 -6 c-2 14 8 10 12 -4 c3 -10 9 -12 10 -2 c1 8 6 8 12 -6" fill="none" stroke="#f2c879" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1330" y="742" text-anchor="middle" font-size="11" letter-spacing="3" font-weight="700" fill="#f2c879">SIGNED</text>
    <text x="1330" y="842" text-anchor="middle" font-size="24" font-weight="700" fill="#f2c879">I sign</text>
    <text x="1330" y="868" text-anchor="middle" font-size="17" fill="#8a8a8a">only then does it reach main</text>

    <!-- audit log -->
    <rect x="72" y="900" width="1456" height="64" rx="12" fill="#111113" stroke="#232326" stroke-width="2"/>
    <text x="98" y="939" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#d4d4d4"><tspan font-weight="700" fill="#737373" letter-spacing="2">AUDIT  </tspan>  task.created <tspan fill="#525252">→</tspan> worktree.created ×3 <tspan fill="#525252">→</tspan> work.committed ×9 <tspan fill="#525252">→</tspan> tests.passed <tspan fill="#525252">→</tspan> diff.reviewed <tspan fill="#525252">→</tspan> <tspan fill="#f2c879">approval.granted</tspan> <tspan fill="#525252">→</tspan> integration.merged</text>
  </g>
</svg>
